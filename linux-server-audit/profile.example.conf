# linux-server-audit: example profile. IT IS A FORM: every value is empty.
#
# Copy this file to ~/.config/audit-skills/profile.conf (or point
# $AUDIT_PROFILE at it) and fill in your own values.
#
# Copied as it stands, this file makes the skills stop: an empty host, user or
# domain list is refused, and so are the placeholder values you find in manuals
# (203.0.113.x, reserved by RFC 5737, and example.com, example.org and
# example.net, reserved by RFC 2606). Nobody owns those names and no machine of
# yours answers there, so a run aimed at them would audit nothing while looking
# like it worked.
#
# The file is sourced by bash: use plain KEY="value" lines, nothing else.
# It is the same file both audit skills read, so you fill it in once.

# Host to audit: hostname or IP address of a machine you own or administer.
SSH_HOST=""

# SSH port. 22 is the default if you leave this out.
SSH_PORT="22"

# Login user. It needs passwordless sudo for the read-only commands, or the
# privileged sections come back as NOT VERIFIED (which is the honest result).
SSH_USER=""

# Space separated list of domains you own. Both skills refuse any target that
# is not one of these domains or a subdomain of one. An empty list means the
# profile was never filled in, and the skills stop.
ALLOWED_DOMAINS=""

# Where reports and raw bundles are written. Relative paths are allowed.
OUTPUT_DIR="./audit-output"
