# web-security-audit: example profile. IT IS A FORM: every value is empty.
#
# Copy this file to ~/.config/audit-skills/profile.conf (or point
# $AUDIT_PROFILE at it) and fill in your own values.
#
# Copied as it stands, this file makes the skills stop: an empty domain list is
# refused, and so are the placeholder names you find in manuals (example.com,
# example.org and example.net, reserved by RFC 2606, and 203.0.113.x, reserved
# by RFC 5737). Nobody owns those names, so a run aimed at them would send
# requests to somebody else's placeholder while looking like it worked.
#
# The file is sourced by bash: use plain KEY="value" lines, nothing else.
# It is the same file both audit skills read, so you fill it in once.

# Space separated list of domains you own. The collector accepts a target only
# if it is one of these domains or a subdomain of one, and refuses everything
# else. An empty list means the profile was never filled in, and the skill
# stops instead of guessing.
ALLOWED_DOMAINS=""

# Where reports and raw bundles are written. Relative paths are allowed.
OUTPUT_DIR="./audit-output"

# Optional, used by the companion skill linux-server-audit. When SSH_HOST is
# set, the web collector also flags that address if it turns up inside a page,
# because the real address of an origin server behind a proxy is worth knowing
# about.
SSH_HOST=""
SSH_PORT="22"
SSH_USER=""
